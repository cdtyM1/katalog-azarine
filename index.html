<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Katalog Azarine</title><style>*{box-sizing:border-box}body{margin:0;background:#17231f;color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column}.bar{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:#21362f}.bar a{color:white;text-decoration:none;background:#365d50;padding:8px 12px;border-radius:12px}.stage{flex:1;display:flex;align-items:center;justify-content:center;gap:12px;padding:18px}.book{display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 18px 30px #0008)}.page{max-height:78vh;max-width:42vw;border-radius:3px;display:block}.page.right{border-left:1px solid #bbb}.nav{border:0;border-radius:50%;width:46px;height:46px;font-size:30px;background:#ffffffdd;color:#244b41;cursor:pointer}.foot{text-align:center;padding:10px;opacity:.8}@media(max-width:700px){.book .left{display:none}.page{max-width:82vw;max-height:75vh}.stage{padding:8px}.bar{font-size:13px}}</style></head><body><div class="bar"><b>KATALOG AZARINE</b><a href="katalog-azarine.pdf" target="_blank">Buka PDF</a></div><div class="stage"><button class="nav" onclick="prev()">‹</button><div class="book"><img id="left" class="page left"><img id="right" class="page right"></div><button class="nav" onclick="next()">›</button></div><div id="count" class="foot"></div><script>const total=12;let p=1;const pad=n=>String(n).padStart(2,'0');function render(){const mobile=innerWidth<=700;let l=document.getElementById('left'),r=document.getElementById('right');if(mobile){r.src=`page-${pad(p)}.jpg`;r.style.display='block';l.style.display='none';document.getElementById('count').textContent=`Halaman ${p} / ${total}`}else{p=p%2===0?p-1:p;l.style.display='block';l.src=`page-${pad(p)}.jpg`;if(p+1<=total){r.style.display='block';r.src=`page-${pad(p+1)}.jpg`}else r.style.display='none';document.getElementById('count').textContent=`Halaman ${p}-${Math.min(p+1,total)} / ${total}`}}function next(){if(innerWidth<=700){if(p<total)p++}else if(p+2<=total)p+=2;render()}function prev(){if(innerWidth<=700){if(p>1)p--}else if(p>1)p-=2;render()}addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev()});addEventListener('resize',render);let x=0;addEventListener('touchstart',e=>x=e.touches[0].clientX);addEventListener('touchend',e=>{let d=e.changedTouches[0].clientX-x;if(d<-40)next();if(d>40)prev()});render();</script></body></html>
