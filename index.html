<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Katalog Azarine 2026</title><style>*{box-sizing:border-box}body{margin:0;background:#0f1715;color:#fff;font-family:Arial,sans-serif;overflow:hidden}.top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#173d35}.brand{font-weight:700}.controls{display:flex;gap:8px;align-items:center}button{border:0;border-radius:9px;padding:9px 13px;cursor:pointer}.book{height:calc(100vh - 58px);display:flex;align-items:center;justify-content:center;perspective:1800px;padding:18px}.page{height:calc(100vh - 95px);max-width:92vw;box-shadow:0 18px 55px #0008;border-radius:3px;transition:transform .38s ease,opacity .25s;background:white;object-fit:contain}.turn{transform:rotateY(-12deg) scale(.97);opacity:.5}.hint{font-size:12px;opacity:.8}@media(max-width:700px){.hint{display:none}.top{padding:0 10px}.page{max-width:98vw;height:auto;max-height:calc(100vh - 85px)}} </style></head><body><div class="top"><div class="brand">Katalog Azarine 2026</div><div class="controls"><span id="counter" class="hint"></span><button onclick="prev()">◀</button><button onclick="next()">▶</button><button onclick="document.documentElement.requestFullscreen?.()">⛶</button></div></div><main class="book" id="book"><img id="page" class="page" alt="Halaman katalog"></main><script>const total=19;let n=1;const img=document.getElementById('page'),counter=document.getElementById('counter');function src(i){return `page-${String(i).padStart(2,'0')}.jpg`}function show(dir=0){img.classList.add('turn');setTimeout(()=>{img.src=src(n);counter.textContent=`${n} / ${total}`;img.classList.remove('turn')},150)}function next(){if(n<total){n++;show(1)}}function prev(){if(n>1){n--;show(-1)}}document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev()});let x=0;document.addEventListener('touchstart',e=>x=e.touches[0].clientX);document.addEventListener('touchend',e=>{let d=e.changedTouches[0].clientX-x;if(d<-45)next();if(d>45)prev()});show();</script></body></html>
